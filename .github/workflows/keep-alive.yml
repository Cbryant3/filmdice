# Pings the backend every 10 minutes so Render's free tier doesn't put it to
# sleep (it sleeps after 15 idle minutes, and waking takes up to a minute).
#
# Setup: GitHub repo → Settings → Secrets and variables → Actions → Variables
#        → New repository variable: BACKEND_URL = https://<your-service>.onrender.com
#
# Notes:
# - GitHub may delay scheduled runs at busy times, so an occasional cold start
#   can still happen. An external monitor (e.g. UptimeRobot) is more precise.
# - GitHub pauses scheduled workflows in repos with no activity for 60 days;
#   re-enable it from the Actions tab if that happens.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL repository variable is not set; skipping."
            exit 0
          fi
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "${BACKEND_URL%/}/health" || true)
            echo "Attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::warning::Backend did not answer /health with 200"

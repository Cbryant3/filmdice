# Runs on every push and pull request: backend tests against a real Postgres,
# then frontend typecheck, lint, production build, and browser tests at phone
# and desktop sizes.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: movie-randomizer-backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: filmdice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # Latest 3.13.x (Render pins 3.13.1 via .python-version; exact patch
          # builds aren't always published for new runner images).
          python-version: "3.13"
          cache: pip
          cache-dependency-path: movie-randomizer-backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filmdice_test
        run: python -m pytest -v

  frontend:
    name: Frontend (typecheck, lint, build, browser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: movie-randomizer-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: movie-randomizer-frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Build and run browser tests (phone + desktop)
        run: npm run test:e2e
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: movie-randomizer-frontend/playwright-report
          retention-days: 14
